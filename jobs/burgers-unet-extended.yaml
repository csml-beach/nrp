apiVersion: batch/v1
kind: Job
metadata:
  name: burgers-unet-extended
  namespace: csml-beach
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      containers:
      - name: gpu-test
        image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
        securityContext:
          runAsUser: 0
        env:
        - name: SCRIPT_NAME
          value: "burgers_unet_extended.py"
        command: ["sh", "-c"]
        args:
          - |
            git clone https://github.com/csml-beach/nrp.git /tmp/repo && \
            pip install scipy && \
            python /tmp/repo/scripts/$SCRIPT_NAME > /mnt/data/output_${SCRIPT_NAME}.txt
        volumeMounts:
        - name: csml-beach-storage
          mountPath: /mnt/data
        resources:
          limits:
            memory: 16Gi
            cpu: "8"
            nvidia.com/gpu: "1"
          requests:
            memory: 8Gi
            cpu: "4"
            nvidia.com/gpu: "1"
      restartPolicy: Never
      volumes:
      - name: csml-beach-storage
        persistentVolumeClaim:
          claimName: csml-beach-pvc
  backoffLimit: 1